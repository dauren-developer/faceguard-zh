<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Face ID">
<title>Face ID</title>
<script src="face-api.min.js"></script>
<style>
:root{
  --bg:#F4F1E8; --bg2:#FBFAF4; --panel:#FFFFFF; --panel2:#ECE7D8;
  --line:#E3DDC9; --line2:#D9D2B8;
  --ink:#1F2D1A; --mut:#6B6456; --mut2:#9B9484;
  --cy:#3F6B2E; --cy-d:#2F5322; --cy-l:rgba(63,107,46,.12);
  --grn:#3F6B2E; --red:#C64B42; --amb:#B9812E;
  --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',monospace;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:22px 18px 28px;position:relative}
.top{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--cy),var(--cy-d));
  display:grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(31,45,26,.1),0 0 16px rgba(63,107,46,.18)}
.logo svg{width:20px;height:20px;stroke:#FAF8F0;fill:none;stroke-width:2.1}
.top b{font-weight:600;font-size:17px;letter-spacing:-0.01em}
.top span{display:block;font-size:11px;color:var(--mut);letter-spacing:.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.hint{font-size:13px;color:var(--mut);line-height:1.5}
.big{font-weight:600;font-size:20px;letter-spacing:-0.01em}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--cy);
  animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--panel);
  box-shadow:0 1px 3px rgba(31,45,26,.06),0 14px 30px -8px rgba(31,45,26,.1)}
.ic svg{width:30px;height:30px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;
  font-weight:600;font-size:16px;letter-spacing:-0.01em;background:var(--cy);color:#FAF8F0;
  box-shadow:0 1px 2px rgba(31,45,26,.1)}
.btn:disabled{opacity:.4}
.btn.gh{background:transparent;color:var(--mut);box-shadow:none}
.link{color:var(--mut);font-size:13px;text-decoration:underline;margin-top:6px}
.search{width:100%;padding:13px;border:1px solid var(--line2);border-radius:11px;background:var(--panel2);color:var(--ink);margin-bottom:12px}
.picklist{display:flex;flex-direction:column;gap:7px;max-height:52vh;overflow-y:auto}
.pickrow{display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);width:100%;text-align:left}
.pickrow b{flex:1;font-weight:500;font-size:14.5px}
.scanwrap{position:relative;width:100%;max-width:300px;aspect-ratio:3/4;border-radius:22px;overflow:hidden;
  background:#000;margin:0 auto 14px;box-shadow:0 1px 3px rgba(31,45,26,.08),0 20px 40px -10px rgba(31,45,26,.18)}
.scanwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.scanwrap img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.scanstate{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#fff;
  background:rgba(0,0,0,.45);padding:6px 0}
.foundring{position:absolute;inset:8px;border-radius:18px;border:3px solid #6FD66B;opacity:0;transition:opacity .2s}
.foundring.on{opacity:1}
.resultcard{text-align:center;margin-bottom:16px}
.resultcard .nm{font-weight:600;font-size:19px;letter-spacing:-0.01em}
.resultcard .tm{font-size:12.5px;color:var(--mut);margin-top:3px}
.bigbtns{display:flex;gap:10px;width:100%}
.bigbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:14px;
  font-weight:600;font-size:13px;letter-spacing:.01em}
.bigbtn svg{width:22px;height:22px;fill:none;stroke-width:1.8}
.bigbtn.in{background:var(--cy-l);color:var(--cy)}
.bigbtn.out{background:rgba(198,75,66,.1);color:var(--red)}
.footlink{text-align:center;margin-top:18px}
.footlink button{font-size:12px;color:var(--mut2);text-decoration:underline}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============ Supabase (общий проект с кіоском Face Guard) ============ */
const SUPABASE_URL='https://iurclpqmjnrzmyhspzcr.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cmNscHFtam5yem15aHNwemNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDE1ODksImV4cCI6MjEwNDUxNzU4OX0.GBmcKXVlYh8nri2-20XrwlRh93BxLUXrXiSc8IH4ISc';
const KIOSK_EMAIL='kiosk@zhaksylyk.kz', KIOSK_PASS='123456789';
let AUTH_TOKEN='', AUTH_EXP=0;

const CFG_DEFAULT={startHour:9,startMin:0,graceMin:15,matchThreshold:0.52,wifiIP:''};
let STAFF=[], CFG={...CFG_DEFAULT}, DAYS={};
const MKEY='fg_my_id_v2';
let MY_ID = (function(){ try{return localStorage.getItem(MKEY)||null;}catch(e){return null;} })();

const pad2=n=>String(n).padStart(2,'0');
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const nowHM=()=>{const d=new Date();return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;};
const minsOf=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
function dayIdxOf(k){ const d=new Date(k+'T00:00:00'); return (d.getDay()+6)%7; }
function graceFor(sid,k){
  const s=STAFF.find(x=>x.id===sid);
  const sch=s&&s.sched&&s.sched[dayIdxOf(k)];
  if(sch&&sch.start){ const[h,m]=sch.start.split(':').map(Number); return h*60+m+CFG.graceMin; }
  return CFG.startHour*60+CFG.startMin+CFG.graceMin;
}

async function signIn(){
  const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',
    headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:KIOSK_EMAIL,password:KIOSK_PASS})});
  const a=await r.json(); if(!r.ok) throw new Error(a.error_description||a.msg||'auth');
  AUTH_TOKEN=a.access_token; AUTH_EXP=Date.now()+(a.expires_in||3600)*1000;
}
async function ensureAuth(){ if(AUTH_TOKEN && Date.now()<AUTH_EXP-60000) return; await signIn(); }
const H=()=>({apikey:SUPABASE_KEY,Authorization:'Bearer '+(AUTH_TOKEN||SUPABASE_KEY),'Content-Type':'application/json'});

async function pullCore(){
  await ensureAuth();
  const r=await fetch(`${SUPABASE_URL}/rest/v1/faceguard_state?id=eq.1&select=rev,data`,{headers:H()});
  if(!r.ok) throw new Error('net');
  const a=await r.json();
  if(!a.length) throw new Error('empty');
  const o=a[0].data||{};
  STAFF=o.staff||[]; DAYS=o.days||{}; CFG=Object.assign({...CFG_DEFAULT},o.cfg||{});
  return a[0];
}
async function pushDayRecord(sid,k,rec){
  await ensureAuth();
  const r=await fetch(`${SUPABASE_URL}/rest/v1/faceguard_state?id=eq.1&select=rev,data`,{headers:H()});
  if(!r.ok) throw new Error('net');
  const a=await r.json();
  const rev=(a&&a[0]&&a[0].rev)||0;
  const data=(a&&a[0]&&a[0].data)||{staff:STAFF,days:{},cfg:CFG};
  if(!data.days) data.days={};
  if(!data.days[k]) data.days[k]={};
  data.days[k][sid]=rec;
  const r2=await fetch(`${SUPABASE_URL}/rest/v1/faceguard_state?on_conflict=id`,{method:'POST',
    headers:{...H(),Prefer:'resolution=merge-duplicates,return=representation'},
    body:JSON.stringify({id:1,rev:rev+1,data,who:'personal:'+sid,updated_at:new Date().toISOString()})});
  if(!r2.ok) throw new Error('push');
  DAYS=data.days;
}
async function myIP(){
  const r=await fetch('https://api.ipify.org?format=json');
  if(!r.ok) throw new Error('ip');
  const j=await r.json();
  if(!j.ip) throw new Error('ip');
  return j.ip;
}

/* ============ UI helpers ============ */
const app=()=>document.getElementById('app');
const ICON_OK='<path d="M20 6L9 17l-5-5"/>';
const ICON_WIFI='<path d="M5 13a10 10 0 0114 0"/><path d="M8.5 16.5a5 5 0 017 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>';
const ICON_FACE='<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z"/>';

function header(sub){
  return `<div class="top">
    <div class="logo"><svg viewBox="0 0 24 24">${ICON_FACE}</svg></div>
    <div><b>FACE ID</b><span>${sub||'жеке белгілеу'}</span></div>
  </div>`;
}
function footSwitch(){
  return MY_ID?`<div class="footlink"><button onclick="resetMe()">Мен емеспін / ауыстыру</button></div>`:'';
}
function renderLoading(txt){
  app().innerHTML = header()+`<div class="center"><div class="spin"></div><div class="hint">${txt}</div></div>`;
}
function renderError(txt,retryFn){
  app().innerHTML = header()+`<div class="center">
    <div class="ic"><svg viewBox="0 0 24 24" style="stroke:var(--red)"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    <div class="hint">${txt}</div>
    <button class="btn" style="max-width:220px" onclick="${retryFn||'main()'}">Қайталау</button>
  </div>`+footSwitch();
}
function renderBlocked(txt){
  app().innerHTML = header('Wi-Fi тексерісі')+`<div class="center">
    <div class="ic"><svg viewBox="0 0 24 24" style="stroke:var(--amb)">${ICON_WIFI}</svg></div>
    <div class="big">Wi-Fi қажет</div>
    <div class="hint">${txt}</div>
    <button class="btn" style="max-width:240px" onclick="checkGateAndProceed()">Қайта тексеру</button>
  </div>`+footSwitch();
}
function renderPick(){
  const list=STAFF.slice().sort((a,b)=>a.name.localeCompare(b.name,'kk'));
  app().innerHTML = header('аты-жөніңізді таңдаңыз')+`
    <div class="hint" style="margin-bottom:12px">Тізімнен өз атыңызды тауып, таңдаңыз. Бұл — тек бір рет, осы телефонда есте сақталады.</div>
    <input class="search" id="pkS" placeholder="Іздеу…" oninput="filterPick()">
    <div class="picklist" id="pkList">${list.map(pickRow).join('')||'<div class="hint">Тізім бос</div>'}</div>`;
}
function pickRow(s){
  return `<button class="pickrow" onclick="confirmPick('${s.id}')">
    ${s.photo?`<img src="${s.photo}" style="width:38px;height:38px;border-radius:9px;object-fit:cover">`:
      `<div style="width:38px;height:38px;border-radius:9px;background:var(--line2)"></div>`}
    <b>${s.name}</b></button>`;
}
function filterPick(){
  const q=document.getElementById('pkS').value.trim().toLowerCase();
  const list=STAFF.filter(s=>s.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'kk'));
  document.getElementById('pkList').innerHTML=list.map(pickRow).join('')||'<div class="hint">Табылмады</div>';
}
function confirmPick(id){
  const s=STAFF.find(x=>x.id===id); if(!s) return;
  app().innerHTML = header()+`<div class="center">
    <div class="big">Сіз — ${s.name}?</div>
    <div class="hint">Бұл телефон енді тек осы адамға тіркеледі.</div>
    <button class="btn" style="max-width:260px" onclick="savePick('${id}')">Иә, бұл менмін</button>
    <button class="btn gh" style="max-width:260px" onclick="renderPick()">Артқа</button>
  </div>`;
}
function savePick(id){
  MY_ID=id;
  try{ localStorage.setItem(MKEY,id); }catch(e){}
  checkGateAndProceed();
}
function resetMe(){
  if(!confirm('Аты-жөнді ауыстыру керек пе?')) return;
  MY_ID=null;
  try{ localStorage.removeItem(MKEY); }catch(e){}
  renderPick();
}

/* ============ Wi-Fi gate ============ */
async function checkGateAndProceed(){
  renderLoading('Wi-Fi тексерілуде…');
  if(!CFG.wifiIP){ renderBlocked('Әкімші әлі Wi-Fi-ды баптамаған. Кіоскідегі әкімшіге айтыңыз.'); return; }
  let ip;
  try{ ip=await myIP(); }catch(e){ renderBlocked('Интернет байланысы жоқ. Wi-Fi-ға қосылып, қайталаңыз.'); return; }
  if(ip!==CFG.wifiIP){ renderBlocked('Кафедегі Wi-Fi-ға қосылыңыз (мобильді интернетте істемейді).'); return; }
  startScan();
}

/* ============ Камера + тану ============ */
let stream=null, scanTimer=null, stableCount=0, modelsReady=false, MODELS_LOADING=null;
function ensureModels(){
  if(modelsReady) return Promise.resolve();
  if(MODELS_LOADING) return MODELS_LOADING;
  MODELS_LOADING=Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri('./models'),
    faceapi.nets.faceLandmark68Net.loadFromUri('./models'),
    faceapi.nets.faceRecognitionNet.loadFromUri('./models'),
  ]).then(()=>{modelsReady=true;});
  return MODELS_LOADING;
}
async function startScan(){
  const me=STAFF.find(x=>x.id===MY_ID);
  if(!me){ renderError('Сіздің жазбаңыз табылмады. Қайта таңдаңыз.','resetMe()'); return; }
  if(!me.descriptor){ renderError('Сіздің бетіңіз жүйеде тіркелмеген. Әкімшіге айтыңыз.'); return; }
  renderLoading('Камера дайындалуда…');
  await ensureModels();
  app().innerHTML = header(me.name)+`
    <div class="scanwrap" id="sw">
      <video id="vid" autoplay muted playsinline></video>
      <div class="foundring" id="ring"></div>
      <div class="scanstate" id="st">бетіңізді көрсетіңіз…</div>
    </div>
    <div id="rz"></div>`+footSwitch();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640}}});
    document.getElementById('vid').srcObject=stream;
  }catch(e){
    app().innerHTML = header()+`<div class="center">
      <div class="hint">Камераға рұқсат жоқ. Браузер баптауларынан рұқсат беріңіз.</div>
      <button class="btn" style="max-width:220px" onclick="startScan()">Қайталау</button></div>`+footSwitch();
    return;
  }
  stableCount=0;
  clearInterval(scanTimer); scanTimer=setInterval(scanTick,650);
}
function stopScan(){ clearInterval(scanTimer); scanTimer=null; if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} }
async function scanTick(){
  const vid=document.getElementById('vid'); if(!vid||vid.readyState<2) return;
  const st=document.getElementById('st'), ring=document.getElementById('ring');
  try{
    const det=await faceapi.detectSingleFace(vid,new faceapi.TinyFaceDetectorOptions({inputSize:224}))
      .withFaceLandmarks().withFaceDescriptor();
    if(!det){ stableCount=0; if(ring)ring.classList.remove('on'); if(st)st.textContent='бетіңізді көрсетіңіз…'; return; }
    const me=STAFF.find(x=>x.id===MY_ID);
    const d=faceapi.euclideanDistance(det.descriptor, me.descriptor);
    if(d<=CFG.matchThreshold){
      stableCount++;
      if(ring)ring.classList.add('on');
      if(st)st.textContent='танылды…';
      if(stableCount>=2) confirmFace();
    } else { stableCount=0; if(ring)ring.classList.remove('on'); if(st)st.textContent='бет сәйкес келмейді'; }
  }catch(e){}
}
function confirmFace(){
  clearInterval(scanTimer);
  const me=STAFF.find(x=>x.id===MY_ID);
  const k=todayKey(), rec=(DAYS[k]&&DAYS[k][me.id])||{};
  const alreadyIn = rec.in && !rec.out;
  document.getElementById('rz').innerHTML = `
    <div class="resultcard">
      <div class="nm">${me.name}</div>
      <div class="tm">${nowHM()} · ${alreadyIn?'кетуді белгілеу':'келуді белгілеу'}</div>
    </div>
    <div class="bigbtns">
      <button class="bigbtn in" onclick="mark('in')" ${alreadyIn?'style="opacity:.4" disabled':''}>
        <svg viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 00-2 2v14a2 2 0 002 2h4"/><path d="M14 17l5-5-5-5"/><path d="M19 12H9"/></svg>
        КЕЛДІМ</button>
      <button class="bigbtn out" onclick="mark('out')" ${!alreadyIn?'style="opacity:.4" disabled':''}>
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h10"/></svg>
        КЕТТІМ</button>
    </div>`;
  const st=document.getElementById('st'); if(st) st.textContent='расталсын ба?';
}
async function mark(kind){
  stopScan();
  const me=STAFF.find(x=>x.id===MY_ID), k=todayKey(), sid=me.id;
  const rec=Object.assign({in:null,out:null,late:false,hoursAuto:null,hoursFinal:null,overridden:false,reason:''},(DAYS[k]&&DAYS[k][sid])||{});
  if(kind==='in'){ rec.in=nowHM(); rec.late=minsOf(rec.in)>graceFor(sid,k); }
  else { rec.out=nowHM(); if(rec.in && !rec.overridden){ const a=minsOf(rec.in), b=minsOf(rec.out); rec.hoursAuto=b>=a?(b-a)/60:null; rec.hoursFinal=rec.hoursAuto; } }
  renderLoading('Сақталуда…');
  try{
    await pushDayRecord(sid,k,rec);
    renderFlash(kind,me.name);
  }catch(e){
    app().innerHTML = header()+`<div class="center">
      <div class="hint">Сақтау мүмкін болмады. Интернетті тексеріп, қайталаңыз.</div>
      <button class="btn" style="max-width:220px" onclick="startScan()">Қайталау</button></div>`+footSwitch();
  }
}
function renderFlash(kind,name){
  const ok=kind==='in';
  app().innerHTML = header()+`<div class="center">
    <div class="ic">
      <svg viewBox="0 0 24 24" style="stroke:${ok?'var(--grn)':'var(--red)'}">${ok?ICON_OK:'<path d="M18 6L6 18M6 6l12 12"/>'}</svg></div>
    <div class="big">${ok?'Сәтті тіркелді — КЕЛДІ':'Сәтті тіркелді — КЕТТІ'}</div>
    <div class="hint">${name} · ${nowHM()}</div>
    <div class="hint" style="margin-top:6px">Қажет болғанда осы бетке қайта оралыңыз.</div>
  </div>`+footSwitch();
}

/* ============ СТАРТ ============ */
async function main(){
  renderLoading('Жүктелуде…');
  try{ await pullCore(); }
  catch(e){ renderError('Деректі жүктеу мүмкін болмады. Интернетті тексеріп, қайталаңыз.'); return; }
  if(!MY_ID || !STAFF.find(x=>x.id===MY_ID)){ renderPick(); return; }
  await checkGateAndProceed();
}
main();
</script>
</body>
</html>
